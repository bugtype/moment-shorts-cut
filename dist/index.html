<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f6f5f1"><meta name="description" content="영상의 가장 좋은 순간을 쇼츠로. 세로 편집, 자동 자막, 음성, 내보내기를 하나의 스튜디오에서." data-i18n-content="shell.description" data-i18n-content-params='{}'><title data-i18n="shell.appTitle">모먼트 — 쇼츠 스튜디오</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff6545'/%3E%3Cpath d='M12 8l13 8-13 8z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="topbar">
 <a class="brand" href="./" aria-label="모먼트 홈" data-i18n-aria-label="shell.home" data-i18n-aria-label-params='{}'><span class="brand-mark"><svg viewBox="0 0 30 30"><path d="M7 7v16l9-8zM17 7v16l8-8z" fill="currentColor"/></svg></span><span>moment<span class="brand-period">.</span></span></a>
 <span class="header-divider"></span><div class="project-title"><input id="projectName" value="나의 첫 번째 쇼츠" aria-label="프로젝트 이름" data-i18n-aria-label="shell.projectName" data-i18n-aria-label-params='{}' maxlength="60"><span id="saveStatus" role="status" aria-live="polite"><i></i> <span data-i18n="shell.savedHere" data-i18n-params='{}'>이 브라우저에 저장</span></span></div>
 <div class="header-actions"><button class="icon-button" id="helpButton" title="사용 가이드" data-i18n-title="shell.help" data-i18n-title-params='{}' aria-label="사용 가이드" data-i18n-aria-label="shell.help" data-i18n-aria-label-params='{}' data-icon="help"></button><button class="icon-button" id="projectFilesButton" data-icon="folder" aria-haspopup="dialog" title="프로젝트 파일" aria-label="프로젝트 파일" data-i18n-title="shell.projectFiles" data-i18n-aria-label="shell.projectFiles"></button><button class="button subtle" id="saveButton" data-icon="save"><span data-i18n="shell.save" data-i18n-params='{}'>저장</span></button><button class="button primary" id="exportButton" data-icon="export"><span data-i18n="shell.export" data-i18n-params='{}'>내보내기</span></button><select id="uiLocale" class="locale-select" aria-label="인터페이스 언어" data-i18n-aria-label="shell.language"><option value="ko">한국어</option><option value="en">English</option><option value="zh-CN">简体中文</option></select><span class="avatar">M</span></div>
</header>
<main class="workspace">

  <button class="rail-button" data-panel="media" data-icon="media" aria-pressed="false"><span data-i18n="shell.media" data-i18n-params='{}'>미디어</span></button>

  <button class="rail-button" data-panel="captions" data-icon="captions" aria-pressed="false"><span data-i18n="shell.captions" data-i18n-params='{}'>자막</span></button>
  <button class="rail-button" data-panel="audio" data-icon="audio" aria-pressed="false"><span data-i18n="shell.audio" data-i18n-params='{}'>오디오</span></button>
  <button class="rail-button" data-panel="text" data-icon="text" aria-pressed="false"><span data-i18n="shell.title" data-i18n-params='{}'>타이틀</span></button>
  <button class="rail-button" data-panel="effects" data-icon="sparkle" aria-pressed="false"><span data-i18n="shell.effects" data-i18n-params='{}'>연출</span></button>
  <button class="rail-button" data-panel="settings" data-icon="sliders" aria-pressed="false"><span data-i18n="shell.frame" data-i18n-params='{}'>화면</span></button>
  <span class="rail-spacer"></span><button class="rail-button" id="resetButton" data-icon="plus"><span data-i18n="shell.newProject" data-i18n-params='{}'>새 작업</span></button><span class="rail-bottom">BETA</span>
 </nav>
 <aside class="library-panel" id="libraryPanel"><div class="panel-sheet-head"><span class="panel-sheet-grip" aria-hidden="true"></span><button class="icon-button panel-sheet-close" id="panelClose" aria-label="편집 패널 닫기" data-i18n-aria-label="shell.closePanel" data-i18n-aria-label-params='{}' data-icon="close"></button></div><div id="panelContent"></div><div class="privacy-note"><span data-icon="shield"></span><span><span data-i18n="shell.privacyTitle" data-i18n-params='{}'>내 영상은 내 브라우저에.</span><br><small><span data-i18n="shell.privacyBody" data-i18n-params='{}'>미디어 파일은 서버로 전송하지 않아요.</span></small></span></div></aside>
 <section class="editor-area" aria-label="영상 편집 작업 영역" data-i18n-aria-label="shell.workspace" data-i18n-aria-label-params='{}'>
  <div class="stage" id="stage"><div class="canvas-wrap" id="canvasWrap"><canvas id="preview" width="540" height="960" aria-label="영상 미리보기" data-i18n-aria-label="shell.preview" data-i18n-aria-label-params='{}'></canvas><div class="safe-guide" id="safeGuide" hidden><div class="safe-top"><span data-i18n="shell.safeTop" data-i18n-params='{}'>상단 UI 예상 영역</span></div><div class="safe-right"><i>♡</i><i>▤</i><i>↗</i></div><div class="safe-bottom"><span data-i18n="shell.safeBottom" data-i18n-params='{}'>채널명 · 설명 예상 영역</span></div><span><span data-i18n="shell.safeNote" data-i18n-params='{}'>기기별로 달라지는 참고용 가이드</span></span></div><div class="layer-selection" id="layerSelection" hidden></div><span class="sample-badge" id="sampleBadge"><span data-i18n="shell.sampleBadge" data-i18n-params='{}'>모션 그래픽 샘플</span></span></div><div class="stage-bottom"><span><i class="live-dot"></i> <span id="previewSize">1080 × 1920</span><span class="move-hint" id="moveHint"><span data-i18n="shell.dragText" data-i18n-params='{}'>글자를 드래그해 이동</span></span></span><div class="stage-actions"><button class="pill stage-ratio" id="ratioShortcut" title="화면 비율 변경" data-i18n-title="shell.ratio" data-i18n-title-params='{}' aria-label="화면 비율 변경" data-i18n-aria-label="shell.ratio" data-i18n-aria-label-params='{}'><span data-icon="portrait"></span><span id="ratioLabel">9:16</span><span data-icon="chevron"></span></button><button class="text-button" id="safeButton" data-icon="safe" aria-pressed="false"><span data-i18n="shell.safeArea" data-i18n-params='{}'>안전 영역</span></button></div></div></div>
  <div class="player-bar"><button class="icon-button" id="startButton" aria-label="처음으로" data-i18n-aria-label="shell.start" data-i18n-aria-label-params='{}' title="처음으로" data-i18n-title="shell.start" data-i18n-title-params='{}' data-icon="skip"></button><button id="playButton" class="play-button" aria-label="재생" data-i18n-aria-label="shell.play" data-i18n-aria-label-params='{}' data-icon="play"></button><button type="button" id="timeDisplay" class="timecode" aria-label="출력 시간으로 이동, 00:00 / 00:12" data-i18n-aria-label="shell.seekA11y" data-i18n-aria-label-params='{"current":"00:00","total":"00:12"}' title="출력 시간으로 이동" data-i18n-title="shell.seekTitle" data-i18n-title-params='{}'>00:00 <span>/ 00:12</span></button><div class="cut-seek-group"><button type="button" class="icon-button" id="previousCutButton" aria-label="이전 컷으로 이동" data-i18n-aria-label="shell.previousCut" title="이전 컷으로 이동" data-i18n-title="shell.previousCut" data-icon="left"></button><input id="seek" type="range" min="0" max="12" step="0.01" value="0" aria-label="재생 위치" data-i18n-aria-label="shell.playhead" data-i18n-aria-label-params='{}'><button type="button" class="icon-button" id="nextCutButton" aria-label="다음 컷으로 이동" data-i18n-aria-label="shell.nextCut" title="다음 컷으로 이동" data-i18n-title="shell.nextCut" data-icon="right"></button></div><button class="icon-button" id="muteButton" aria-label="미리보기 음소거" data-i18n-aria-label="shell.mute" data-i18n-aria-label-params='{}' data-icon="volume"></button><select id="speed" aria-label="재생 및 출력 속도" data-i18n-aria-label="shell.speed" data-i18n-aria-label-params='{}'><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option><option id="currentSpeedOption" value="" hidden></option><option value="custom" data-i18n="shell.customSpeed">사용자 지정…</option></select></div>
  <section class="timeline" id="timeline"><div class="timeline-tools"><div class="tool-group"><button class="icon-button" id="undoButton" title="실행 취소 (Ctrl+Z)" data-i18n-title="shell.undoTitle" data-i18n-title-params='{}' aria-label="실행 취소" data-i18n-aria-label="shell.undo" data-i18n-aria-label-params='{}' data-icon="undo"></button><button class="icon-button" id="redoButton" title="다시 실행" data-i18n-title="shell.redo" data-i18n-title-params='{}' aria-label="다시 실행" data-i18n-aria-label="shell.redo" data-i18n-aria-label-params='{}' data-icon="redo"></button><span class="thin-divider"></span><button class="text-button" id="splitButton" data-icon="scissors"><span data-i18n="shell.split" data-i18n-params='{}'>분할</span></button><button class="text-button" id="duplicateClipButton" title="선택 클립을 바로 뒤에 복제" data-i18n-title="shell.duplicateTitle" data-i18n-title-params='{}' aria-label="선택 클립 복제" data-i18n-aria-label="shell.duplicateClip" data-i18n-aria-label-params='{}'><span data-i18n="shell.duplicate" data-i18n-params='{}'>복제</span></button><button class="icon-button" id="deleteButton" title="선택 클립 삭제" data-i18n-title="shell.deleteClip" data-i18n-title-params='{}' aria-label="선택 클립 삭제" data-i18n-aria-label="shell.deleteClip" data-i18n-aria-label-params='{}' data-icon="trash"></button></div><button class="icon-button" id="timelineToggle" title="타임라인 접기" data-i18n-title="shell.collapseTimeline" data-i18n-title-params='{}' aria-label="타임라인 접기" data-i18n-aria-label="shell.collapseTimeline" data-i18n-aria-label-params='{}' aria-expanded="true" aria-controls="timelineBody" data-icon="chevron"></button><span class="timeline-hint"><span data-i18n="shell.timelineHint" data-i18n-params='{}'>클립을 선택해 구간을 편집하세요</span></span><button class="icon-button" id="moveLeft" title="선택 클립 앞으로" data-i18n-title="shell.moveLeft" data-i18n-title-params='{}' aria-label="선택 클립 앞으로" data-i18n-aria-label="shell.moveLeft" data-i18n-aria-label-params='{}' data-icon="left"></button><button class="icon-button" id="moveRight" title="선택 클립 뒤로" data-i18n-title="shell.moveRight" data-i18n-title-params='{}' aria-label="선택 클립 뒤로" data-i18n-aria-label="shell.moveRight" data-i18n-aria-label-params='{}' data-icon="right"></button></div><div class="timeline-body" id="timelineBody"><div class="track-labels"><span class="timeline-zoom-slot"><button class="timeline-zoom" id="timelineZoom" type="button" title="타임라인 확대 (1× → 2× → 4× → 8×)" data-i18n-title="shell.zoomTimeline" data-i18n-title-params='{"levels":"1× → 2× → 4× → 8×"}' aria-label="타임라인 확대, 현재 1배" data-i18n-aria-label="shell.zoomTimelineA11y" data-i18n-aria-label-params='{"zoom":1}'><span data-icon="zoom"></span><span id="timelineZoomLabel">1×</span></button></span><span class="title-track-label" data-icon="text"><span data-i18n="shell.text" data-i18n-params='{}'>텍스트</span></span><span data-icon="video"><span data-i18n="shell.video" data-i18n-params='{}'>영상</span></span><span data-icon="captions"><span data-i18n="shell.captions" data-i18n-params='{}'>자막</span></span><span data-icon="audio"><span data-i18n="shell.audio" data-i18n-params='{}'>오디오</span></span></div><div class="tracks-area" id="tracksArea"><div class="ruler" id="ruler"></div><div class="title-track" id="titleTrack" aria-label="타이틀, 크레딧과 장면 카드 표시 구간" data-i18n-aria-label="shell.layersTrack" data-i18n-aria-label-params='{}'></div><div class="video-track" id="videoTrack"></div><div class="caption-track" id="captionTrack"></div><button class="audio-track" id="audioTrack"><span data-i18n="shell.addAudio" data-i18n-params='{}'>+ 오디오를 추가해 보세요</span></button><div class="playhead" id="playhead"><i></i></div></div></div></section>
 </section>
 <aside class="inspector" aria-label="편집 속성" data-i18n-aria-label="shell.properties" data-i18n-aria-label-params='{}'><div class="inspector-title"><span data-i18n="shell.properties" data-i18n-params='{}'>편집 속성</span> <span data-icon="sliders"></span></div><details class="inspector-section" name="inspector" id="frameSettings" open><summary><span data-i18n="shell.frame" data-i18n-params='{}'>화면</span><span data-icon="chevron"></span></summary><div class="inspector-controls"><div class="section-label"><span data-i18n="shell.aspectRatio" data-i18n-params='{}'>화면 비율</span></div><div class="ratio-grid" role="group" aria-label="화면 비율" data-i18n-aria-label="shell.aspectRatio" data-i18n-aria-label-params='{}'><button class="ratio-option active" data-ratio="9:16" aria-pressed="true"><i class="ratio-shape portrait" aria-hidden="true"></i><strong>9:16</strong></button><button class="ratio-option" data-ratio="4:5" aria-pressed="false"><i class="ratio-shape feed-portrait" aria-hidden="true"></i><strong>4:5</strong></button><button class="ratio-option" data-ratio="1:1" aria-pressed="false"><i class="ratio-shape square" aria-hidden="true"></i><strong>1:1</strong></button><button class="ratio-option" data-ratio="16:9" aria-pressed="false"><i class="ratio-shape landscape" aria-hidden="true"></i><strong>16:9</strong></button></div><div class="field-label"><span data-i18n="shell.frameFit" data-i18n-params='{}'>화면 채우기</span></div><div class="segmented"><button class="active" data-fit="cover" aria-pressed="true"><span data-i18n="shell.cover" data-i18n-params='{}'>채우기</span></button><button data-fit="contain" aria-pressed="false"><span data-i18n="shell.contain" data-i18n-params='{}'>전체 보기</span></button></div><label class="slider-label"><span data-i18n="shell.zoom" data-i18n-params='{}'>확대</span> <output id="zoomValue">100%</output></label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="영상 확대" data-i18n-aria-label="shell.videoZoom" data-i18n-aria-label-params='{}'><button class="button" id="keepGapsButton"><span data-i18n="panels.keepGaps" data-i18n-params='{}'>빈 구간만 유지…</span></button><button class="button" id="openFraming"><span data-i18n="panels.framing" data-i18n-params='{}'>영상 구도…</span></button></div></details>
 <details class="inspector-section" name="inspector" id="clipSettings"><summary><span id="clipIndex"><span data-i18n="shell.clip" data-i18n-params='{"index":1}'>클립 1</span></span><span data-icon="chevron"></span></summary><div class="inspector-controls"><div class="time-fields"><div class="trim-draft-field"><div class="trim-field-heading"><label for="trimStart"><span data-i18n="shell.startSeconds">시작 (초)</span></label><button type="button" class="icon-button trim-playhead" id="trimStartPlayhead" aria-label="현재 위치를 시작값으로 입력" data-i18n-aria-label="panels.trimStartPlayhead" title="현재 위치를 시작값으로 입력" data-i18n-title="panels.trimStartPlayhead" data-icon="playhead"></button></div><input id="trimStart" type="number" min="0" step="any" value="0"></div><div class="trim-draft-field"><div class="trim-field-heading"><label for="trimEnd"><span data-i18n="shell.endSeconds">끝 (초)</span></label><button type="button" class="icon-button trim-playhead" id="trimEndPlayhead" aria-label="현재 위치를 끝값으로 입력" data-i18n-aria-label="panels.trimEndPlayhead" title="현재 위치를 끝값으로 입력" data-i18n-title="panels.trimEndPlayhead" data-icon="playhead"></button></div><input id="trimEnd" type="number" min="0" step="any" value="12"></div></div><button class="button full subtle compact" id="trimButton" data-icon="scissors"><span data-i18n="shell.applyTrim" data-i18n-params='{}'>선택 구간 적용</span></button><button class="button full subtle compact" id="moveClipButton"><span data-i18n="panels.moveClip">클립 이동…</span></button><button class="button full subtle compact" id="removeClipRangeButton"><span data-i18n="panels.removeClipRange">클립 범위 삭제…</span></button><label class="slider-label"><span data-i18n="shell.volume" data-i18n-params='{}'>원본 볼륨</span> <output id="volumeValue">100%</output></label><input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="원본 볼륨" data-i18n-aria-label="shell.volume" data-i18n-aria-label-params='{}'></div></details>
 <details class="inspector-section" name="inspector" id="captionSettings"><summary><span data-i18n="shell.captionStyle" data-i18n-params='{}'>자막 스타일</span><span data-icon="chevron"></span></summary><div class="inspector-controls"><div class="caption-styles"><button class="caption-style active" data-style="impact"><span><span data-i18n="shell.styleExample" data-i18n-params='{}'>오늘의 순간</span></span><small><span data-i18n="shell.impact" data-i18n-params='{}'>임팩트</span></small></button><button class="caption-style" data-style="highlight"><span><span data-i18n="shell.styleExample" data-i18n-params='{}'>오늘의 순간</span></span><small><span data-i18n="shell.highlight" data-i18n-params='{}'>하이라이트</span></small></button><button class="caption-style" data-style="minimal"><span><span data-i18n="shell.styleExample" data-i18n-params='{}'>오늘의 순간</span></span><small><span data-i18n="shell.minimal" data-i18n-params='{}'>미니멀</span></small></button></div></div></details>
 </aside>
</main>
<footer class="statusbar"><span><i class="live-dot"></i> <span data-i18n="shell.localWork" data-i18n-params='{}'>모든 작업은 이 기기에서 진행됩니다</span></span><span><span data-i18n="shell.enjoy" data-i18n-params='{}'>만드는 즐거움에 집중하세요.</span><span class="footer-brand"> made with moment.</span></span></footer>

<input id="projectInput" type="file" accept=".json,application/json" hidden>
<video id="sourceVideo" playsinline preload="auto" hidden></video><audio id="sourceAudio" preload="auto" hidden></audio>
