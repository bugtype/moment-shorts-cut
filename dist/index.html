<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f6f5f1"><meta name="description" content="영상의 가장 좋은 순간을 쇼츠로. 세로 편집, 자동 자막, 음성, 내보내기를 하나의 스튜디오에서."><title>모먼트 — 쇼츠 스튜디오</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ff6545'/%3E%3Cpath d='M12 8l13 8-13 8z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="topbar">
 <a class="brand" href="./" aria-label="모먼트 홈"><span class="brand-mark"><svg viewBox="0 0 30 30"><path d="M7 7v16l9-8zM17 7v16l8-8z" fill="currentColor"/></svg></span><span>moment<span class="brand-period">.</span></span></a>
 <span class="header-divider"></span><div class="project-title"><input id="projectName" value="나의 첫 번째 쇼츠" aria-label="프로젝트 이름" maxlength="60"><span id="saveStatus" role="status" aria-live="polite"><i></i> 이 브라우저에 저장</span></div>
 <div class="header-actions"><button class="icon-button" id="helpButton" title="사용 가이드" aria-label="사용 가이드" data-icon="help"></button><button class="button subtle" id="saveButton" data-icon="save">저장</button><button class="button primary" id="exportButton" data-icon="export">내보내기</button><span class="avatar">M</span></div>
</header>
<main class="workspace">
 <nav class="rail" aria-label="편집 도구">
  <button class="rail-button" data-panel="media" data-icon="media" aria-pressed="false">미디어</button>
  <button class="rail-button active" data-panel="templates" data-icon="grid" aria-pressed="true">템플릿</button>
  <button class="rail-button" data-panel="captions" data-icon="captions" aria-pressed="false">자막</button>
  <button class="rail-button" data-panel="audio" data-icon="audio" aria-pressed="false">오디오</button>
  <button class="rail-button" data-panel="text" data-icon="text" aria-pressed="false">타이틀</button>
  <button class="rail-button" data-panel="effects" data-icon="sparkle" aria-pressed="false">연출</button>
  <button class="rail-button" data-panel="settings" data-icon="sliders" aria-pressed="false">화면</button>
  <span class="rail-spacer"></span><button class="rail-button" id="resetButton" data-icon="plus">새 작업</button><span class="rail-bottom">BETA</span>
 </nav>
 <aside class="library-panel" id="libraryPanel"><div class="panel-sheet-head"><span class="panel-sheet-grip" aria-hidden="true"></span><button class="icon-button panel-sheet-close" id="panelClose" aria-label="편집 패널 닫기" data-icon="close"></button></div><div id="panelContent"></div><div class="privacy-note"><span data-icon="shield"></span><span>내 영상은 내 브라우저에.<br><small>미디어 파일은 서버로 전송하지 않아요.</small></span></div></aside>
 <section class="editor-area" aria-label="영상 편집 작업 영역">
  <div class="stage" id="stage"><div class="canvas-wrap" id="canvasWrap"><canvas id="preview" width="540" height="960" aria-label="영상 미리보기"></canvas><div class="safe-guide" id="safeGuide" hidden><div class="safe-top">상단 UI 예상 영역</div><div class="safe-right"><i>♡</i><i>▤</i><i>↗</i></div><div class="safe-bottom">채널명 · 설명 예상 영역</div><span>기기별로 달라지는 참고용 가이드</span></div><div class="layer-selection" id="layerSelection" hidden></div><span class="sample-badge" id="sampleBadge">모션 그래픽 샘플</span></div><div class="stage-bottom"><span><i class="live-dot"></i> <span id="previewSize">1080 × 1920</span><span class="move-hint" id="moveHint">글자를 드래그해 이동</span></span><div class="stage-actions"><button class="pill stage-ratio" id="ratioShortcut" title="화면 비율 변경" aria-label="화면 비율 변경"><span data-icon="portrait"></span><span id="ratioLabel">9:16</span><span data-icon="chevron"></span></button><button class="text-button" id="safeButton" data-icon="safe" aria-pressed="false">안전 영역</button></div></div></div>
  <div class="player-bar"><button class="icon-button" id="startButton" aria-label="처음으로" title="처음으로" data-icon="skip"></button><button id="playButton" class="play-button" aria-label="재생" data-icon="play"></button><span id="timeDisplay" class="timecode">00:00 <span>/ 00:12</span></span><input id="seek" type="range" min="0" max="12" step="0.01" value="0" aria-label="재생 위치"><button class="icon-button" id="muteButton" aria-label="미리보기 음소거" data-icon="volume"></button><select id="speed" aria-label="재생 및 출력 속도"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div>
  <section class="timeline" id="timeline"><div class="timeline-tools"><div class="tool-group"><button class="icon-button" id="undoButton" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소" data-icon="undo"></button><button class="icon-button" id="redoButton" title="다시 실행" aria-label="다시 실행" data-icon="redo"></button><span class="thin-divider"></span><button class="text-button" id="splitButton" data-icon="scissors">분할</button><button class="icon-button" id="deleteButton" title="선택 클립 삭제" aria-label="선택 클립 삭제" data-icon="trash"></button></div><button class="icon-button" id="timelineToggle" title="타임라인 접기" aria-label="타임라인 접기" aria-expanded="true" aria-controls="timelineBody" data-icon="chevron"></button><span class="timeline-hint">클립을 선택해 구간을 편집하세요</span><button class="icon-button" id="moveLeft" title="선택 클립 앞으로" aria-label="선택 클립 앞으로" data-icon="left"></button><button class="icon-button" id="moveRight" title="선택 클립 뒤로" aria-label="선택 클립 뒤로" data-icon="right"></button></div><div class="timeline-body" id="timelineBody"><div class="track-labels"><span class="timeline-zoom-slot"><button class="timeline-zoom" id="timelineZoom" type="button" title="타임라인 확대 (1× → 2× → 4× → 8×)" aria-label="타임라인 확대, 현재 1배"><span data-icon="zoom"></span><span id="timelineZoomLabel">1×</span></button></span><span class="title-track-label" data-icon="text">텍스트</span><span data-icon="video">영상</span><span data-icon="captions">자막</span><span data-icon="audio">오디오</span></div><div class="tracks-area" id="tracksArea"><div class="ruler" id="ruler"></div><div class="title-track" id="titleTrack" aria-label="타이틀, 크레딧과 장면 카드 표시 구간"></div><div class="video-track" id="videoTrack"></div><div class="caption-track" id="captionTrack"></div><button class="audio-track" id="audioTrack">+ 오디오를 추가해 보세요</button><div class="playhead" id="playhead"><i></i></div></div></div></section>
 </section>
 <aside class="inspector" aria-label="편집 속성"><div class="inspector-title">편집 속성 <span data-icon="sliders"></span></div><details class="inspector-section" name="inspector" id="frameSettings" open><summary>화면<span data-icon="chevron"></span></summary><div class="inspector-controls"><div class="section-label">화면 비율</div><div class="ratio-grid"><button class="ratio-option active" data-ratio="9:16" aria-pressed="true"><i class="ratio-shape portrait"></i><strong>9:16</strong><small>세로</small></button><button class="ratio-option" data-ratio="1:1" aria-pressed="false"><i class="ratio-shape square"></i><strong>1:1</strong><small>정사각</small></button><button class="ratio-option" data-ratio="16:9" aria-pressed="false"><i class="ratio-shape landscape"></i><strong>16:9</strong><small>가로</small></button></div><div class="field-label">화면 채우기</div><div class="segmented"><button class="active" data-fit="cover" aria-pressed="true">채우기</button><button data-fit="contain" aria-pressed="false">전체 보기</button></div><label class="slider-label">확대 <output id="zoomValue">100%</output></label><input id="zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="영상 확대"></div></details>
 <details class="inspector-section" name="inspector" id="clipSettings"><summary><span id="clipIndex">클립 1</span><span data-icon="chevron"></span></summary><div class="inspector-controls"><div class="time-fields"><label>시작 (초)<input id="trimStart" type="number" min="0" step="0.1" value="0"></label><span>—</span><label>끝 (초)<input id="trimEnd" type="number" min="0" step="0.1" value="12"></label></div><button class="button full subtle compact" id="trimButton" data-icon="scissors">선택 구간 적용</button><label class="slider-label">원본 볼륨 <output id="volumeValue">100%</output></label><input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="원본 볼륨"></div></details>
 <details class="inspector-section" name="inspector" id="captionSettings"><summary>자막 스타일<span data-icon="chevron"></span></summary><div class="inspector-controls"><div class="caption-styles"><button class="caption-style active" data-style="impact"><span>오늘의 순간</span><small>임팩트</small></button><button class="caption-style" data-style="highlight"><span>오늘의 순간</span><small>하이라이트</small></button><button class="caption-style" data-style="minimal"><span>오늘의 순간</span><small>미니멀</small></button></div></div></details>
 </aside>
</main>
<footer class="statusbar"><span><i class="live-dot"></i> 모든 작업은 이 기기에서 진행됩니다</span><span>만드는 즐거움에 집중하세요.<span class="footer-brand"> made with moment.</span></span></footer>
<input id="videoInput" type="file" accept="video/*" hidden><input id="audioInput" type="file" accept="audio/*" hidden><input id="srtInput" type="file" accept=".srt,.vtt,text/plain" hidden>
<input id="projectInput" type="file" accept=".json,application/json" hidden>
<video id="sourceVideo" playsinline preload="auto" hidden></video><audio id="sourceAudio" preload="auto" hidden></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog><script type="module" src="./app.js"></script>
</body></html>
